name: isofood-website
type: php
docroot: web
php_version: "8.4"
webserver_type: nginx-fpm
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
database:
  type: mariadb
  version: "10.11"
nodejs_version: "20"
composer_root: ""
composer_version: "2"
upload_dirs:
  - "app/uploads"
web_environment:
  - WP_ENV=development
use_dns_when_possible: true
timezone: "Europe/Ljubljana"
